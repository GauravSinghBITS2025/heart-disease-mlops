
name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-train:
    name: Lint, test and train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint Python code
        run: |
          python -m ruff check src tests --select E9,F63,F7,F82 --output-format=github

      - name: Acquire dataset
        run: python src/data_acquisition.py

      - name: Preprocess dataset
        run: python src/data_preprocessing.py

      - name: Run exploratory data analysis
        run: python src/eda.py

      - name: Train and track models
        run: python src/train.py

      - name: Finalize model package
        run: python src/stage3_finalize.py

      - name: Verify model package
        run: python src/verify_package.py

      - name: Run Pytest suite
        run: |
          python -m pytest -v \
            --junitxml=artifacts/reports/pytest-results.xml

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-mlops-artifacts
          path: |
            artifacts/
            mlruns/
          if-no-files-found: warn
          retention-days: 14

